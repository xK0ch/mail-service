# Reference only. This service does NOT run its own nginx.
#
# mail-service has no public port and lives only inside the shared `proxy-net`
# Docker network. Public TLS termination and routing are handled by the central
# reverse proxy in the `fynn-koch-landingpage` project.
#
# Because the service is internal, you do not strictly need a separate nginx for
# it. You only need to tell the central proxy how to reach it. Add a location
# block to the relevant server block in fynn-koch-landingpage/nginx.conf so the
# contact form can POST to the API on the same origin (no CORS needed).
#
# Example: expose the API under tanzschule.fynn-koch.de/api/ and serve the
# static landing page from the tanzschule-ui container:
#
#   server {
#       listen 443 ssl;
#       server_name tanzschule.fynn-koch.de;
#
#       ssl_certificate     /etc/letsencrypt/live/fynn-koch.de/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/fynn-koch.de/privkey.pem;
#       ssl_protocols TLSv1.2 TLSv1.3;
#       ssl_ciphers HIGH:!aNULL:!MD5;
#
#       # API -> mail-service (internal container, port 8080)
#       location /api/ {
#           resolver 127.0.0.11 valid=30s;
#           set $mail_upstream http://mail-service:8080;
#           proxy_pass         $mail_upstream;
#           proxy_set_header   Host              $host;
#           proxy_set_header   X-Real-IP         $remote_addr;
#           proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#           proxy_set_header   X-Forwarded-Proto $scheme;
#       }
#
#       # Everything else -> static landing page container
#       location / {
#           resolver 127.0.0.11 valid=30s;
#           set $ui_upstream http://tanzschule-ui;
#           proxy_pass         $ui_upstream;
#           proxy_set_header   Host              $host;
#           proxy_set_header   X-Forwarded-Proto $scheme;
#       }
#   }
#
# If you expose the API on the same origin as the landing page (as above), the
# CORS_ALLOWED_ORIGINS setting becomes irrelevant for production; the browser
# never makes a cross-origin request. Keep it for local development against the
# Vite dev server (http://localhost:5173).
