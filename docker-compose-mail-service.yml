services:
  mail-service:
    build: .
    container_name: mail-service
    environment:
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
      MAIL_API_KEY: ${MAIL_API_KEY:-changeme}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://tanzschule.fynn-koch.de}
    networks:
      - proxy-net
      - mail-net
    restart: unless-stopped

# proxy-net: public reverse proxy (owned by the landing page).
# mail-net: internal service-to-service network; other services (e.g. mealplan-service)
# join it as an external network to reach the API-key protected /api/send endpoint
# without going over the public internet.
networks:
  proxy-net:
    name: proxy-net
    external: true
  mail-net:
    name: mail-net
